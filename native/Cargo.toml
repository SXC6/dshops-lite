[package]
name = "dsh-ops-core"
version = "0.5.4"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[lib]
path = "src/lib.rs"

[[bin]]
name = "dsh-ops-worker"
path = "src/main.rs"

[dependencies]
cap-std = "3.4"
cap-fs-ext = "3.4"
serde_json = "1.0"
ops-protocol = { path = "crates/ops-protocol" }
ops-files = { path = "crates/ops-files" }
ops-documents = { path = "crates/ops-documents" }
ops-search = { path = "crates/ops-search" }
ops-results = { path = "crates/ops-results" }
ops-batch = { path = "crates/ops-batch" }

[lints.rust]
unsafe_code = "forbid"

# Stripped release builds. The published upstream binary is ~3.9 MiB; an
# unstripped local build is ~7.8 MiB. Symbol stripping halves what the plugin
# ships and changes no behaviour.
[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[workspace]
members = ["windows-metadata", "darwin-metadata", "crates/*"]
resolver = "3"
